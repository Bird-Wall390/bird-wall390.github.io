plugins { id 'com.android.application' }
android {
    namespace 'io.github.bird_wall390.rod'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.bird_wall390.rod'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        rod {
            storeFile file('rod.keystore')
            storePassword 'rodgame1'
            keyAlias 'rod'
            keyPassword 'rodgame1'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.rod }
        debug { signingConfig signingConfigs.rod }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
