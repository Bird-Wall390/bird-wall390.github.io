# 앱(APK) 자동 빌드: android 폴더가 바뀌면 GitHub가 APK를 만들어 "Releases"에 올립니다.
# 받는 주소: https://github.com/Bird-Wall390/bird-wall390.github.io/releases/latest/download/RiskOfDungeon.apk
name: Build APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk RiskOfDungeon.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Risk Of Dungeon 앱 (빌드 ${{ github.run_number }})
          body: 휴대폰에서 아래 RiskOfDungeon.apk 를 눌러 받은 뒤 설치하세요. 게임 내용은 설치 후에도 자동으로 최신 버전이 열립니다.
          make_latest: true
          files: RiskOfDungeon.apk
